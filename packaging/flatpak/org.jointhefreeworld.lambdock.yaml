app-id: org.jointhefreeworld.lambdock
runtime: org.gnome.Platform
runtime-version: '50'
sdk: org.gnome.Sdk
sdk-extensions:
  # `rustc' and `cargo' are not in the GNOME SDK; the Rust extension is the
  # supported way to build the ported modules inside the sandbox.
  - org.freedesktop.Sdk.Extension.rust-stable
command: lambdock
finish-args:
  - --socket=wayland
  - --share=ipc
  - --filesystem=host
  - --device=dri
  - --env=GDK_BACKEND=wayland

modules:
  # Boehm Garbage Collector (required by Guile)
  - name: bdwgc
    buildsystem: autotools
    sources:
      - type: archive
        url: https://github.com/ivmai/bdwgc/releases/download/v8.2.8/gc-8.2.8.tar.gz
        sha256: 7649020621cb26325e1fb5c8742590d92fb48ce5c259b502faf7d9fb5dabb160

  # GNU Guile 3.0
  - name: guile
    buildsystem: autotools
    build-options:
      env:
        LDFLAGS: "-L/app/lib -Wl,-rpath=/app/lib"
    config-opts:
      - --disable-static
    sources:
      - type: archive
        url: https://ftp.gnu.org/gnu/guile/guile-3.0.11.tar.xz
        sha256: 818c79d236657a7fa96fb364137cc7b41b3bdee0d65c6174ca03769559579460

  # gtk4-layer-shell
  - name: gtk4-layer-shell
    buildsystem: meson
    config-opts:
      - -Dtests=false
      - -Dexamples=false
    sources:
      - type: archive
        url: https://github.com/wmww/gtk4-layer-shell/archive/refs/tags/v1.3.0.zip
        sha256: 854da55ef2a621bbf28984b394ce356d8820c3b2b9d35f3a8b9fa9e0614c859c

  # Lambdock
  - name: lambdock
    # cargo produces the binary (resources and the Wayland protocol generated by
    # build.rs) and `cargo xtask' installs it with the data files.
    buildsystem: simple
    build-commands:
      # Compiled in, or the installed dock only finds its Scheme modules when
      # it happens to be run from the source tree.
      - export LAMBDOCK_SCHEME_DIR=/app/share/guile/site/3.0
      - export LAMBDOCK_LOCALEDIR=/app/share/locale
      - cargo build --offline --locked --release
      - cargo run --offline --locked -p xtask -- install --prefix /app
    build-options:
      append-path: /usr/lib/sdk/rust-stable/bin
    sources:
      - type: dir
        path: ../../
