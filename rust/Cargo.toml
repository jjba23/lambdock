# SPDX-License-Identifier: MIT
# Copyright © Josep Bigorra <jjbigorra@gmail.com>

[package]
name = "lambdock"
# The version that ships, and the one the Makefile installs and the packaging
# reads. The crate is never published, so this is the only place it is written.
version = "2.1.12"
edition = "2021"
publish = false
license = "MIT"

[lib]
name = "lambdock"
# `staticlib` is what meson links into the C executable; `rlib` is what
# `cargo test` needs to link the unit tests.
crate-type = ["staticlib", "rlib"]

[[bin]]
name = "lambdock"
# The executable is Rust too: `cargo build` produces it, and the one C file the
# project had is gone.
path = "src/main.rs"

[dependencies]
gtk4 = { version = "0.11.5", features = ["v4_14"] }

# The lints live here rather than in `#![...]` attributes so they apply to every
# target the crate builds -- library, unit tests and the doc tests alike -- and so
# a reader finds them next to the toolchain that runs them. `clippy::` lints are
# ignored by a plain `cargo build`, which is what lets this be a deny without
# making a packager's build depend on clippy being installed.
[lints.rust]
# Lifetime elision in paths is the one rust-2018 idiom worth denying: `&ItemNames`
# reads as if the lifetime did not matter, and it is exactly the lifetime that
# keeps a borrowed name from outliving its array.
rust_2018_idioms = { level = "deny", priority = -2 }

[lints.clippy]
all = { level = "deny", priority = -1 }
