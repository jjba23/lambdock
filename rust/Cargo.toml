# lambdock -- hyper-hackable desktop dock for Wayland
#
# SPDX-License-Identifier: MIT
# Copyright © Josep Bigorra <jjbigorra@gmail.com>

[package]
name = "lambdock"
# The version that ships is `project(version:)` in meson.build, which the
# packaging and `--version` read. This crate is never published, so it does not
# keep a second copy to drift out of step.
version = "0.0.0"
edition = "2021"
publish = false
license = "MIT"

[lib]
name = "lambdock"
# `staticlib` is what meson links into the C executable; `rlib` is what
# `cargo test` needs to link the unit tests.
crate-type = ["staticlib", "rlib"]

[dependencies]
gtk4 = "0.11.5"

# One codegen unit per module, so a C test that only calls a decision function
# does not drag the widget code (and GTK) into its link: the linker only pulls
# the objects a target references.
[profile.release]
codegen-units = 256
